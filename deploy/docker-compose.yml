# Production stack for a single public host: CoverPilot (web app + voice agent) behind Caddy,
# which gets and renews the HTTPS certificate automatically (the microphone needs HTTPS).
#
# Needs next to this file:
#   .env                 PUBLIC_HOST=<hostname> and COVERPILOT_IMAGE=<tag>   (written by deploy.sh)
#   secrets/.env.local   the app's settings and keys, copied from omni_browse/.env.local:
#                        META_MODEL_API_KEY, GOOGLE_TTS_API_KEY, TURN_*, and GUARDIAN_PROVIDER plus the
#                        GUARDIAN_OPEN_* values when Muse Spark Open is used (see omni_browse/.env.example).
#                        Keys are mounted read-only at run time and are never baked into the image.
# See docs/DEPLOY.md for the full steps.
services:
  coverpilot:
    image: ${COVERPILOT_IMAGE:-coverpilot:amd64}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Caddy sets X-Forwarded-For, so the per-visitor rate limits can tell visitors apart.
      TRUST_PROXY: "true"
    volumes:
      - ./secrets/.env.local:/app/omni_browse/.env.local:ro
      # memory.sqlite, cases.jsonl and vault/ (encrypted paused proposals, ciphertext only) live here
      - coverpilot-data:/app/voice-agent-py/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - coverpilot
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  coverpilot-data:
  caddy-data:
  caddy-config:
